<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | 株式会社炎熟</title>
  <meta name="description" content="株式会社炎熟へのお問い合わせ。物流業界の課題解決、BPO・ビズデブのご相談はこちらから。完全成果報酬で対応します。">
  <meta property="og:title" content="お問い合わせ | 株式会社炎熟">
  <meta property="og:description" content="物流業界の課題解決のご相談はこちら。完全成果報酬で対応。">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (CDN) -->

    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#0A1628', light: '#0F1D32', lighter: '#162240' },
            accent: '#F97316',
          },
          fontFamily: {
            ja: ['Noto Sans JP', 'sans-serif'],
            en: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

  <!-- ========== Navigation ========== -->
  <header class="nav-header fixed top-0 left-0 right-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="flex items-center gap-2">
          <span class="text-2xl font-bold font-en"><span class="text-accent">炎</span>熟</span>
        </a>
        <nav class="hidden md:flex items-center gap-8">
          <a href="index.html" class="nav-link text-sm">ABOUT</a>
          <a href="company.html" class="nav-link text-sm">COMPANY</a>
          <a href="contact.html" class="btn-primary text-sm !py-2 !px-5 nav-active-btn">
            <i class="fa-solid fa-envelope"></i>
            お問い合わせ
          </a>
        </nav>
        <div class="hamburger md:hidden">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile Menu -->
  <div class="mobile-menu fixed inset-0 z-40 bg-navy/98 backdrop-blur-lg flex flex-col items-center justify-center gap-8">
    <a href="index.html" class="text-xl font-semibold text-white hover:text-accent transition-colors">ABOUT</a>
    <a href="company.html" class="text-xl font-semibold text-white hover:text-accent transition-colors">COMPANY</a>
    <a href="contact.html" class="btn-primary mt-4 ring-2 ring-accent ring-offset-2 ring-offset-navy">
      <i class="fa-solid fa-envelope"></i>
      お問い合わせ
    </a>
  </div>

  <!-- ========== Page Header ========== -->
  <section class="pt-32 pb-16 relative overflow-hidden grid-bg">
    <div class="absolute inset-0 bg-gradient-to-b from-accent/5 to-transparent"></div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
      <div class="text-center">
        <span class="section-label fade-up">CONTACT</span>
        <h1 class="section-title text-4xl sm:text-5xl mt-4 fade-up fade-up-delay-1">お問い合わせ</h1>
        <p class="section-description mt-6 fade-up fade-up-delay-2">
          まずは無料相談から。御社の課題をお聞かせください。<br>
          物流のプロが最適なソリューションをご提案します。
        </p>
      </div>
    </div>
  </section>

  <div class="gradient-divider"></div>

  <!-- ========== Contact Form Section ========== -->
  <section class="py-24 md:py-32">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="max-w-2xl mx-auto fade-up">
        <div class="bg-navy-light/50 border border-white/5 rounded-2xl p-8 md:p-12">
          <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
            <div class="form-group">
              <label class="form-label">
                会社名
                <span class="required">必須</span>
              </label>
              <input type="text" name="company" class="form-input" placeholder="例: 株式会社〇〇" required>
            </div>

            <div class="grid sm:grid-cols-2 gap-4">
              <div class="form-group">
                <label class="form-label">
                  お名前
                  <span class="required">必須</span>
                </label>
                <input type="text" name="name" class="form-input" placeholder="例: 山田 太郎" required>
              </div>
              <div class="form-group">
                <label class="form-label">
                  メールアドレス
                  <span class="required">必須</span>
                </label>
                <input type="email" name="email" class="form-input" placeholder="例: info@example.com" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">電話番号</label>
              <input type="tel" name="phone" class="form-input" placeholder="例: 03-1234-5678">
            </div>

            <div class="form-group">
              <label class="form-label">
                ご相談内容
                <span class="required">必須</span>
              </label>
              <select name="category" class="form-select" required>
                <option value="" disabled selected>選択してください</option>
                <option value="資料作成">資料作成</option>
                <option value="WMS導入支援">WMS導入支援</option>
                <option value="採用支援">採用計画・採用支援</option>
                <option value="新規事業">新規事業開発支援</option>
                <option value="営業支援">営業支援</option>
                <option value="BPO">BPO全般</option>
                <option value="その他">その他</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">
                お問い合わせ内容
                <span class="required">必須</span>
              </label>
              <textarea name="message" class="form-textarea" placeholder="御社の課題やご要望をお聞かせください" required></textarea>
            </div>

            <div class="text-center mt-8">
              <button type="submit" class="btn-primary text-base px-10 py-4">
                <i class="fa-solid fa-paper-plane"></i>
                送信する
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== Footer ========== -->
  <footer class="border-t border-white/5 py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col md:flex-row items-center justify-between gap-6">
        <a href="index.html" class="flex items-center gap-2">
          <span class="text-xl font-bold font-en"><span class="text-accent">炎</span>熟</span>
          <span class="text-gray-500 text-sm ml-2">株式会社炎熟</span>
        </a>
        <nav class="flex items-center gap-6">
          <a href="index.html" class="footer-link">About</a>
          <a href="company.html" class="footer-link">Company</a>
          <a href="contact.html" class="footer-link">Contact</a>
        </nav>
      </div>
      <div class="mt-8 pt-8 border-t border-white/5 text-center">
        <p class="text-gray-500 text-sm font-en">
          &copy; <span id="currentYear"></span> ENJUKU Inc. All rights reserved.
        </p>
      </div>
    </div>
  </footer>

  <button class="scroll-top" aria-label="ページトップへ">
    <i class="fa-solid fa-chevron-up"></i>
  </button>

  <script src="js/main.js"></script>
  <script>document.getElementById('currentYear').textContent = new Date().getFullYear();</script>
</body>
</html>
